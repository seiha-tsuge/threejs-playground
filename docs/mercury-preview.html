<!doctype html>
<html lang="ja">
  <meta charset="utf-8" />
  <title>水星 — 実シーンの近接確認</title>
  <style>
    html, body, #scene { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <div id="scene"></div>
  <script type="module">
    import { createSpaceScene } from '../src/three/createSpaceScene.ts'
    import { createSceneAnimation } from '../src/three/createSceneAnimation.ts'
    import { observeSceneResize } from '../src/three/observeSceneResize.ts'

    // アプリと同じメッシュ・配置・照明を使い、撮影用にカメラだけを近づける。
    const container = document.querySelector('#scene')
    const space = createSpaceScene(container)
    const center = space.mercury.position
    space.controls.minDistance = 0.08
    space.controls.target.copy(center)
    space.camera.position.copy(center).add({ x: -0.075, y: 0.035, z: 0.115 })
    space.controls.update()
    observeSceneResize({ container, camera: space.camera, renderer: space.renderer })
    await space.renderer.init()
    space.renderer.setAnimationLoop(createSceneAnimation(space))
  </script>
</html>
