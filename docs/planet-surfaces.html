<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>惑星の地表 — 描画確認</title>
<style>
  body { max-width: 1000px; margin: 0 auto; background: #020617; color: #e2e8f0; font: 16px system-ui; }
  h1 { margin: 24px 32px 8px; font-size: 24px; }
  p { margin: 0 32px 16px; color: #94a3b8; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); }
  figure { margin: 0; text-align: center; }
  canvas { width: 100%; aspect-ratio: 1; display: block; }
  figcaption { margin-bottom: 12px; }
  #status { padding: 12px 0; }
</style>
<h1>8惑星の地表表現</h1>
<p>カタログの半径・軌道位置と太陽光を使用。各カメラの距離を変えて拡大表示しています。地球の大陸は模式表現です。</p>
<div id="grid"></div>
<p id="status">描画を確認中…</p>
<script type="module">
  import * as THREE from 'three/webgpu'
  import { createPlanet } from '/src/three/createPlanet.ts'
  import { PLANETS } from '/src/three/planetCatalog.ts'
  import { createSunLight } from '/src/three/createSunLight.ts'
  import { createOrbitAnchors } from '/src/three/createOrbitAnchors.ts'

  const status = document.querySelector('#status')
  const resources = []
  try {
    const anchors = createOrbitAnchors()
    for (const data of PLANETS) {
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x020617)
      const mesh = createPlanet(data)
      mesh.position.x = data.orbitRadius
      anchors[data.id].add(mesh)
      scene.add(anchors[data.id], createSunLight())
      if (mesh.geometry.parameters.radius !== data.displayRadius ||
          mesh.getWorldPosition(new THREE.Vector3()).x !== data.orbitRadius ||
          mesh.parent.userData.planetId !== data.id) {
        throw new Error(`${data.id}: カタログ・アンカーとの不一致`)
      }
      const camera = new THREE.PerspectiveCamera(35, 1, 0.001, 400)
      camera.position.copy(mesh.position).addScaledVector(
        new THREE.Vector3(-0.85, 0.35, 0.5).normalize(), data.displayRadius * 3.8,
      )
      camera.lookAt(mesh.position)
      const renderer = new THREE.WebGPURenderer({ antialias: true })
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.toneMapping = THREE.ACESFilmicToneMapping
      renderer.setSize(480, 480, false)
      const figure = document.createElement('figure')
      const caption = document.createElement('figcaption')
      caption.textContent = data.name
      figure.append(renderer.domElement, caption)
      document.querySelector('#grid').append(figure)
      resources.push({ mesh, renderer })
      await renderer.init()
      await renderer.compileAsync(scene, camera)
      renderer.render(scene, camera)
    }
    status.textContent = 'PASS — 8惑星の半径・軌道位置・アンカーを検証し、全マテリアルをコンパイル・描画しました。'
  } catch (error) {
    status.textContent = `FAIL — ${error.message}`
    console.error(error)
  }
  addEventListener('pagehide', () => {
    for (const { mesh, renderer } of resources) {
      mesh.geometry.dispose()
      mesh.material.dispose()
      renderer.dispose()
    }
  })
</script>
</html>
