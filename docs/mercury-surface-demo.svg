<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Mercury surface preview</title>
  <desc id="description">A gray-brown Mercury with a cratered procedural surface in space.</desc>
  <defs>
    <radialGradient id="space" cx="78%" cy="44%" r="80%">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="planet" cx="30%" cy="28%" r="72%">
      <stop offset="0" stop-color="#c4b7a6" />
      <stop offset="0.44" stop-color="#938679" />
      <stop offset="0.78" stop-color="#62574d" />
      <stop offset="1" stop-color="#29231e" />
    </radialGradient>
    <radialGradient id="crater" cx="36%" cy="31%" r="70%">
      <stop offset="0" stop-color="#362d26" />
      <stop offset="0.54" stop-color="#554a40" />
      <stop offset="0.77" stop-color="#b3a493" />
      <stop offset="1" stop-color="#716458" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="terminator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020617" stop-opacity="0" />
      <stop offset="0.65" stop-color="#020617" stop-opacity="0.12" />
      <stop offset="1" stop-color="#020617" stop-opacity="0.82" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <clipPath id="planet-clip">
      <circle cx="720" cy="420" r="244" />
    </clipPath>
    <pattern id="stars" width="180" height="140" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="24" r="1.3" fill="#fff" opacity=".72" />
      <circle cx="82" cy="92" r="1" fill="#cbd5e1" opacity=".48" />
      <circle cx="156" cy="48" r="1.5" fill="#fff" opacity=".6" />
      <circle cx="128" cy="128" r=".8" fill="#fef3c7" opacity=".7" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#space)" />
  <rect width="1200" height="800" fill="url(#stars)" opacity=".9" />

  <circle cx="720" cy="420" r="270" fill="#9b8067" opacity=".2" filter="url(#glow)" />
  <circle cx="720" cy="420" r="244" fill="url(#planet)" />

  <g clip-path="url(#planet-clip)">
    <g fill="url(#crater)">
      <circle cx="575" cy="280" r="31" />
      <circle cx="664" cy="250" r="20" />
      <circle cx="764" cy="275" r="43" />
      <circle cx="856" cy="310" r="27" />
      <circle cx="530" cy="387" r="22" />
      <circle cx="620" cy="374" r="48" />
      <circle cx="737" cy="365" r="25" />
      <circle cx="833" cy="405" r="57" />
      <circle cx="580" cy="490" r="39" />
      <circle cx="699" cy="475" r="18" />
      <circle cx="776" cy="530" r="36" />
      <circle cx="888" cy="525" r="24" />
      <circle cx="673" cy="585" r="44" />
    </g>
    <g fill="none" stroke="#d7c9b8" stroke-width="4" opacity=".34">
      <circle cx="575" cy="280" r="31" />
      <circle cx="764" cy="275" r="43" />
      <circle cx="620" cy="374" r="48" />
      <circle cx="833" cy="405" r="57" />
      <circle cx="580" cy="490" r="39" />
      <circle cx="673" cy="585" r="44" />
    </g>
    <rect x="720" y="160" width="244" height="520" fill="url(#terminator)" />
  </g>

  <circle cx="720" cy="420" r="244" fill="none" stroke="#d6c5b2" stroke-opacity=".5" stroke-width="3" />
  <text x="72" y="104" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="700">Mercury surface preview</text>
  <text x="74" y="143" fill="#aebbd0" font-family="system-ui, sans-serif" font-size="18">Procedural terrain noise with crater floors and raised rims</text>
  <text x="74" y="722" fill="#aebbd0" font-family="system-ui, sans-serif" font-size="16">灰褐色の地表マテリアル / 水星アンカー</text>
</svg>
